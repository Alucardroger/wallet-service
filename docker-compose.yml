# docker compose up -d --build   -> PostgreSQL, SQS (MiniStack), Keycloak, migrations and 3 app instances
# docker compose up -d postgres ministack   -> only the infrastructure (local development and tests)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # AWS SQS emulator (free, no account). The image ships its own health check.
  ministack:
    image: nahuelnucera/ministack
    ports:
      - "4566:4566"

  # External Identity Provider (OIDC). The "wagering" realm, with one client per
  # game provider and one operator client, is imported from ./keycloak at startup.
  # Development mode and fixed secrets: for local use only.
  keycloak:
    image: keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Runs once, applies pending migrations and exits. The app waits for it.
  migrate:
    build: .
    command: ["bun", "run", "src/infrastructure/database/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Three instances share the database and the queues: http://localhost:3000, :3001 and :3002
  app:
    build: .
    deploy:
      replicas: 3
    ports:
      - "3000-3002:3000"
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
      SQS_ENDPOINT: http://ministack:4566
      AUTH_ENABLED: "true"
      # Tokens are requested from the host at localhost:8080, so that is their issuer.
      # The app reaches the same Keycloak through the Compose network to fetch its keys.
      AUTH_ISSUER: http://localhost:8080/realms/wagering
      AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      AUTH_AUDIENCE: wagering-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
